<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- YouTube embeds need to see this page's address (otherwise: "Error 153"). -->
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Tambourine — Dylan Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,800;1,500;1,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<style>
/* ===================================================================
   THEME
   Custom CSS carries the look; Tailwind utilities are used for small
   layout helpers. Headings are styled by class (not element) so that
   Tailwind's preflight reset can't flatten them.
   =================================================================== */
:root{
  --bg:#121212; --bg-2:#171615; --panel:#1b1a18; --panel-2:#23211e; --line:#2f2c27; --line-2:#3c3831;
  --text:#ece5d6; --muted:#9d958a; --faint:#6f685f;
  --gold:#d4a94e; --gold-2:#e6c47a; --gold-dim:rgba(212,169,78,.14); --gold-line:rgba(212,169,78,.35);
  --red:#d9705f; --red-dim:rgba(217,112,95,.14); --green:#8fb37a;
  --serif:"Playfair Display", Georgia, "Times New Roman", serif;
  --sans:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --bar-h:78px; --radius:10px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body{min-height:100vh;padding-bottom:calc(var(--bar-h) + 24px)}
/* subtle paper grain + vignette for the poster feel */
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(1200px 600px at 50% -200px, rgba(212,169,78,.07), transparent 70%),
             radial-gradient(900px 500px at 100% 100%, rgba(120,60,30,.06), transparent 70%)}
a{color:var(--gold);text-decoration:none}
a:hover{color:var(--gold-2)}
::selection{background:var(--gold);color:#1a1408}
input,select,textarea,button{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* ---------- header / nav ---------- */
.app-header{position:sticky;top:0;z-index:40;background:rgba(18,18,18,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.header-inner{max-width:1320px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;gap:24px}
.brand{display:flex;align-items:center;gap:10px;color:var(--text);flex-shrink:0}
.brand:hover{color:var(--text)}
.brand-mark{width:30px;height:30px;flex-shrink:0}
.brand-name{font-family:var(--serif);font-weight:800;letter-spacing:.22em;font-size:19px}
.brand-sub{display:block;font-family:var(--sans);font-size:10px;letter-spacing:.28em;color:var(--muted);text-transform:uppercase;margin-top:-2px}
.nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1}
.nav::-webkit-scrollbar{display:none}
.nav a{color:var(--muted);padding:8px 12px;border-radius:999px;font-size:14px;font-weight:500;white-space:nowrap;transition:color .15s,background .15s}
.nav a:hover{color:var(--text);background:var(--panel)}
.nav a.active{color:var(--gold);background:var(--gold-dim)}
.nav a.nav-songs{font-family:var(--serif);font-style:italic;font-size:15px}
.header-actions{display:flex;gap:8px;flex-shrink:0}

/* ---------- buttons, inputs, chips ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line-2);background:var(--panel);color:var(--text);
  padding:8px 14px;border-radius:999px;font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap;transition:all .15s;line-height:1.2}
.btn:hover{border-color:var(--gold-line);color:var(--gold-2)}
.btn:disabled,.btn[aria-disabled="true"]{opacity:.4;cursor:not-allowed;color:var(--muted);border-color:var(--line)}
.btn-gold{background:var(--gold);border-color:var(--gold);color:#1b1407;font-weight:600}
.btn-gold:hover{background:var(--gold-2);border-color:var(--gold-2);color:#1b1407}
.btn-ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn-ghost:hover{background:var(--panel);border-color:var(--line);color:var(--text)}
.btn-danger:hover{border-color:var(--red);color:var(--red)}
.btn-sm{padding:5px 10px;font-size:12.5px}
.btn-icon{width:34px;height:34px;padding:0;border-radius:50%}
.btn-icon.btn-sm{width:28px;height:28px}
.icon{width:16px;height:16px;flex-shrink:0;fill:currentColor}
.icon-lg{width:22px;height:22px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>span,.label{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.input,.select,.textarea{background:var(--bg-2);border:1px solid var(--line-2);border-radius:8px;padding:9px 11px;width:100%;color:var(--text);transition:border-color .15s}
.input:focus,.select:focus,.textarea:focus{outline:none;border-color:var(--gold)}
.textarea{resize:vertical;min-height:90px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;line-height:1.5}
.select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
.check{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:14px;color:var(--text);user-select:none}
.check input{accent-color:var(--gold);width:16px;height:16px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600;letter-spacing:.02em;
  border:1px solid var(--line-2);color:var(--muted);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.chip-era{border-color:color-mix(in srgb,var(--c) 55%,transparent);color:color-mix(in srgb,var(--c) 85%,white);background:color-mix(in srgb,var(--c) 13%,transparent)}
.chip-type{font-family:ui-monospace,Menlo,monospace;font-size:10.5px;letter-spacing:.08em}
.chip-type.SBD{color:var(--green);border-color:rgba(143,179,122,.45)}
.chip-type.PRO{color:#9fb7e0;border-color:rgba(159,183,224,.45)}
.chip-type.AUD{color:#d9b48a;border-color:rgba(217,180,138,.4)}
.chip-dead{color:var(--red);border-color:rgba(217,112,95,.5);background:var(--red-dim)}
.chip-toggle{cursor:pointer;padding:5px 11px;font-size:12.5px;font-weight:500;transition:all .15s}
.chip-toggle:hover{color:var(--text);border-color:var(--gold-line)}
.chip-toggle.on{background:var(--gold-dim);border-color:var(--gold);color:var(--gold-2)}
.chip-toggle.chip-era.on{background:color-mix(in srgb,var(--c) 28%,transparent);border-color:var(--c);color:white}
.chip .n{opacity:.6;font-weight:500}
.badge-notable{display:inline-block;font-family:var(--serif);font-style:italic;font-size:12.5px;color:#1b1407;background:var(--gold);padding:2px 9px;border-radius:3px;
  box-shadow:0 2px 8px rgba(0,0,0,.4);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kicker{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold);font-weight:600}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.small{font-size:13px}
.err{color:var(--red);font-size:13px}
.warnbox{border:1px solid var(--gold-line);background:var(--gold-dim);border-radius:8px;padding:12px 14px;font-size:14px}
.errbox{border:1px solid rgba(217,112,95,.5);background:var(--red-dim);border-radius:8px;padding:12px 14px;font-size:14px}
.rule{height:1px;background:linear-gradient(90deg,transparent,var(--line-2),transparent);border:0;margin:28px 0}

/* ---------- layout ---------- */
main{position:relative;z-index:1;max-width:1320px;margin:0 auto;padding:28px 24px 40px}
.view-title{font-family:var(--serif);font-weight:700;font-size:40px;line-height:1.1;margin:4px 0 6px;letter-spacing:-.01em}
.view-sub{color:var(--muted);margin:0 0 24px;max-width:680px}
.section-title{font-family:var(--serif);font-weight:600;font-size:22px;margin:0 0 12px;display:flex;align-items:baseline;gap:10px}
.section-title .count{font-family:var(--sans);font-size:13px;color:var(--muted);font-weight:400}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius)}
.empty{border:1px dashed var(--line-2);border-radius:var(--radius);padding:36px 24px;text-align:center;color:var(--muted)}
.empty .empty-title{font-family:var(--serif);font-size:20px;color:var(--text);margin-bottom:6px}
.empty .btn{margin-top:14px}

/* ---------- shelves (continue listening / on this day) ---------- */
.shelves{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px;margin-bottom:30px}
.shelf{padding:18px 18px 16px}
.shelf-row{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.mini{flex:0 0 200px;cursor:pointer;border-radius:8px;overflow:hidden;background:var(--panel-2);border:1px solid var(--line);position:relative;transition:border-color .15s}
.mini:hover{border-color:var(--gold-line)}
.mini .mini-thumb{aspect-ratio:16/9;background:#0d0d0c;position:relative;overflow:hidden}
.mini .mini-thumb img{width:100%;height:100%;object-fit:cover;opacity:.85}
.mini .mini-body{padding:8px 10px}
.mini .mini-date{font-family:var(--serif);font-size:14px;font-weight:600}
.mini .mini-venue{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.progress{height:3px;background:rgba(255,255,255,.12)} .progress>i{display:block;height:100%;background:var(--gold)}
.mini .dismiss{position:absolute;top:6px;right:6px;opacity:0;transition:opacity .15s;background:rgba(0,0,0,.7)}
.mini:hover .dismiss{opacity:1}
.otd-list{display:flex;flex-direction:column;gap:8px}
.otd-item{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:8px;background:var(--panel-2);cursor:pointer;border:1px solid transparent}
.otd-item:hover{border-color:var(--gold-line)}
.otd-year{font-family:var(--serif);font-size:24px;font-weight:700;color:var(--gold);width:64px;flex-shrink:0}

/* ---------- year slider + histogram ---------- */
.yearbox{padding:22px 24px 18px;margin-bottom:22px;position:relative;overflow:hidden}
.yearbox-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.year-readout{font-family:var(--serif);font-size:44px;font-weight:800;line-height:1;letter-spacing:-.01em}
.year-readout .dash{color:var(--faint);font-weight:500;margin:0 6px}
.year-readout .cnt{font-size:22px;font-weight:500;color:var(--muted);font-style:italic}
.year-actions{display:flex;gap:8px;flex-wrap:wrap}
.histo-wrap{padding:0 7px} /* matches half the slider thumb so bars line up with years */
.histo{display:flex;align-items:flex-end;height:70px;gap:1px}
.histo .bar{flex:1;min-width:0;height:100%;display:flex;align-items:flex-end;cursor:pointer;position:relative}
.histo .bar i{display:block;width:100%;background:var(--line-2);border-radius:2px 2px 0 0;transition:background .12s;min-height:2px}
.histo .bar.has i{background:color-mix(in srgb,var(--gold) 55%,#3a3226)}
.histo .bar:hover i{background:var(--gold-2)}
.histo .bar.sel i{background:var(--gold);box-shadow:0 0 12px rgba(212,169,78,.6)}
.eraband{display:flex;height:6px;gap:1px;margin-top:6px;border-radius:3px;overflow:hidden}
.eraband i{flex:1;min-width:0;opacity:.75}
.year-slider{width:100%;margin:10px 0 0;-webkit-appearance:none;appearance:none;background:transparent;height:22px;cursor:pointer}
.year-slider::-webkit-slider-runnable-track{height:3px;background:var(--line-2);border-radius:2px}
.year-slider::-moz-range-track{height:3px;background:var(--line-2);border-radius:2px}
.year-slider::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:22px;border-radius:3px;background:var(--gold);margin-top:-9.5px;box-shadow:0 0 0 4px rgba(212,169,78,.18)}
.year-slider::-moz-range-thumb{width:14px;height:22px;border-radius:3px;background:var(--gold);border:0;box-shadow:0 0 0 4px rgba(212,169,78,.18)}
.year-slider.idle::-webkit-slider-thumb{background:var(--muted);box-shadow:none}
.year-slider.idle::-moz-range-thumb{background:var(--muted);box-shadow:none}
.decades{position:relative;height:16px;margin:0 7px;font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
.decades span{position:absolute;transform:translateX(-50%)}

/* ---------- filters ---------- */
.filters{display:flex;flex-direction:column;gap:12px;margin-bottom:20px}
.filters-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search-input{flex:1 1 280px;min-width:200px;position:relative}
.search-input .input{padding-left:36px}
.search-input .icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);fill:var(--muted)}
.era-chips{display:flex;gap:6px;flex-wrap:wrap}

/* ---------- concert grid ---------- */
.grid-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;color:var(--muted);font-size:13px}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;cursor:pointer;display:flex;flex-direction:column;
  transition:transform .18s,border-color .18s,box-shadow .18s}
.card:hover{transform:translateY(-2px);border-color:var(--gold-line);box-shadow:0 10px 30px rgba(0,0,0,.45)}
.card.playing{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.thumb{aspect-ratio:16/9;position:relative;background:#0d0d0c;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(.85) contrast(1.05)}
.thumb .badge-notable{position:absolute;left:10px;bottom:10px;max-width:calc(100% - 64px)}
.thumb .chip-dead{position:absolute;right:10px;top:10px}
.thumb .play-fab{position:absolute;right:10px;bottom:10px;width:42px;height:42px;border-radius:50%;background:var(--gold);color:#1b1407;border:0;cursor:pointer;
  display:flex;align-items:center;justify-content:center;opacity:0;transform:translateY(6px);transition:all .18s;box-shadow:0 4px 14px rgba(0,0,0,.5)}
.card:hover .play-fab,.play-fab:focus-visible{opacity:1;transform:none}
.play-fab:hover{background:var(--gold-2)}
.poster{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:12px 16px;
  background:repeating-linear-gradient(135deg,#191714 0 6px,#1c1a17 6px 12px);border-bottom:1px solid var(--line)}
.poster::before{content:"";position:absolute;inset:8px;border:1px solid rgba(212,169,78,.22);pointer-events:none}
.poster .p-year{font-family:var(--serif);font-weight:800;font-size:40px;color:var(--gold);line-height:1;letter-spacing:.02em}
.poster .p-venue{font-family:var(--serif);font-style:italic;font-size:13px;color:var(--muted);margin-top:6px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.poster .p-rule{width:40px;height:1px;background:var(--gold-line);margin:8px 0 0}
.thumb.noimg img{display:none}
.card-body{padding:12px 14px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.card-date{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:600}
.card-venue{font-family:var(--serif);font-weight:700;font-size:18px;line-height:1.2;margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-city{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:2px}
.card-foot{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:auto;padding-top:6px}
.card-foot .left{display:flex;gap:4px;align-items:center;min-width:0}
.star{color:var(--faint)} .star.on{color:var(--gold)}
.star:hover{color:var(--gold-2)}

/* ---------- modal ---------- */
.modal-root{position:fixed;inset:0;z-index:70;display:none}
.modal-root.open{display:block}
.modal-backdrop{position:absolute;inset:0;background:rgba(5,5,5,.72);backdrop-filter:blur(3px)}
.modal{position:absolute;left:50%;top:40px;transform:translateX(-50%);width:min(900px,calc(100vw - 32px));max-height:calc(100vh - var(--bar-h) - 60px);
  overflow:auto;background:var(--bg-2);border:1px solid var(--line-2);border-radius:14px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.modal-sm{width:min(440px,calc(100vw - 32px));top:90px}
.modal-close{position:sticky;top:12px;float:right;margin:12px 12px 0 0;z-index:2;background:rgba(0,0,0,.6)}
.detail-hero{position:relative;padding:28px 30px 22px;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,rgba(212,169,78,.08),transparent 80%)}
.detail-date{font-size:12.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:600}
.detail-venue{font-family:var(--serif);font-weight:800;font-size:38px;line-height:1.08;margin:6px 0 4px}
.detail-place{color:var(--muted);font-size:15px}
.detail-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.detail-body{padding:24px 30px 30px;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:30px}
.dsec{margin-bottom:24px}
.dsec-title{font-family:var(--serif);font-size:19px;font-weight:600;margin:0 0 10px;display:flex;align-items:center;gap:10px;justify-content:space-between}
.setlist{list-style:none;margin:0;padding:0;counter-reset:song}
.setlist li{counter-increment:song;display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:6px;font-size:14.5px}
.setlist li::before{content:counter(song);width:24px;text-align:right;color:var(--faint);font-variant-numeric:tabular-nums;font-size:12.5px;flex-shrink:0}
.setlist li.seekable{cursor:pointer}
.setlist li.seekable:hover{background:var(--panel-2);color:var(--gold-2)}
.setlist li .ts{margin-left:auto;font-variant-numeric:tabular-nums;font-size:12px;color:var(--muted)}
.setlist li.now{background:var(--gold-dim);color:var(--gold-2)}
.setlist li.now::before{content:"♪";color:var(--gold)}
.source{border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:10px;background:var(--panel)}
.source.primary{border-color:var(--gold-line)}
.source-title{font-weight:600;font-size:14px;word-break:break-word}
.source-meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:6px 0 8px;font-size:12.5px;color:var(--muted)}
.source-actions{display:flex;gap:6px;flex-wrap:wrap}
.fav-box{border:1px solid var(--gold-line);background:var(--gold-dim);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px}
.kv{display:grid;grid-template-columns:90px 1fr;gap:4px 10px;font-size:14px}
.kv dt{color:var(--muted);font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding-top:2px}
.kv dd{margin:0}
.era-editor{border:1px solid var(--line-2);border-radius:8px;padding:12px;margin-top:10px;background:var(--panel)}

/* ---------- lists (favorites / playlists / songs) ---------- */
.rowlist{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:14px;padding:10px 12px;border-radius:8px;background:var(--panel);border:1px solid var(--line);min-width:0}
.row:hover{border-color:var(--line-2)}
.row .r-thumb{width:96px;aspect-ratio:16/9;border-radius:5px;overflow:hidden;background:#0d0d0c;position:relative;flex-shrink:0;cursor:pointer}
.row .r-thumb img{width:100%;height:100%;object-fit:cover}
.row .r-thumb .poster .p-year{font-size:18px}
.row .r-thumb .poster .p-venue,.row .r-thumb .poster .p-rule{display:none}
.row .r-main{flex:1;min-width:0;cursor:pointer}
.row .r-title{font-family:var(--serif);font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .r-sub{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .r-actions{display:flex;gap:4px;flex-shrink:0}
.two-col{display:grid;grid-template-columns:300px minmax(0,1fr);gap:24px;align-items:start}
.side{padding:14px;position:sticky;top:80px;max-height:calc(100vh - 180px);overflow:auto}
.side-item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;border-radius:7px;color:var(--text);cursor:pointer;font-size:14px}
.side-item:hover{background:var(--panel-2);color:var(--text)}
.side-item.active{background:var(--gold-dim);color:var(--gold-2)}
.side-item .n{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.song-hero{padding:22px 24px;margin-bottom:18px}
.song-title{font-family:var(--serif);font-weight:800;font-size:34px;line-height:1.1;margin:4px 0}
.perf-year{font-family:var(--serif);font-size:20px;color:var(--gold);font-weight:700;margin:16px 0 6px}
.perf{display:flex;align-items:center;gap:14px;padding:10px 12px;border-radius:8px;background:var(--panel);border:1px solid var(--line);margin-bottom:6px}
.perf .p-date{width:110px;flex-shrink:0;font-size:13px;color:var(--muted)}
.perf .p-main{flex:1;min-width:0;cursor:pointer}
.perf .p-main b{font-weight:600}
.tag{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:999px;background:var(--panel-2);border:1px solid var(--line-2);color:var(--muted);margin-right:4px}

/* ---------- forms (add / settings) ---------- */
.form-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px}
.c12{grid-column:span 12}.c8{grid-column:span 8}.c6{grid-column:span 6}.c4{grid-column:span 4}.c3{grid-column:span 3}
.form-card{padding:22px 24px;margin-bottom:20px}
.form-card-title{font-family:var(--serif);font-size:22px;font-weight:700;margin:0 0 4px}
.preview{display:flex;gap:14px;align-items:center;margin-top:10px}
.preview img{width:200px;aspect-ratio:16/9;object-fit:cover;border-radius:6px;border:1px solid var(--line-2)}
.era-table{width:100%;border-collapse:collapse;font-size:14px}
.era-table th{text-align:left;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:6px 6px}
.era-table td{padding:4px 6px;vertical-align:middle}
.era-table .input{padding:6px 8px}
.swatch{width:12px;height:12px;border-radius:3px;display:inline-block}

/* ---------- map ---------- */
/* OpenStreetMap's light tiles, turned dark to match the app (labels stay readable) */
#map.map-darken .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.92) contrast(.88) saturate(.55)}
#map{height:calc(100vh - 300px);min-height:380px;border-radius:var(--radius);border:1px solid var(--line);background:#0e0e0e}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--bg-2);color:var(--text);border:1px solid var(--line-2)}
.leaflet-popup-content{margin:12px 14px;font-family:var(--sans)}
.leaflet-container a.leaflet-popup-close-button{color:var(--muted)}
.leaflet-container .leaflet-control-attribution{background:rgba(18,18,18,.8);color:var(--faint)}
.leaflet-container .leaflet-control-attribution a{color:var(--muted)}
.pop-item{padding:6px 0;border-top:1px solid var(--line)} .pop-item:first-of-type{border-top:0}
.pop-date{font-family:var(--serif);font-weight:700;font-size:15px}

/* ---------- search ---------- */
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.sres{padding:0;overflow:hidden;display:flex;flex-direction:column}
.sres img{width:100%;aspect-ratio:16/9;object-fit:cover}
.sres .s-body{padding:10px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.sres .s-title{font-weight:600;font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* ---------- player bar ---------- */
.player-bar{position:fixed;left:0;right:0;bottom:0;height:var(--bar-h);z-index:60;background:rgba(14,14,13,.97);border-top:1px solid var(--line-2);
  display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr) minmax(0,1fr);align-items:center;gap:18px;padding:0 20px;backdrop-filter:blur(12px)}
.pb-now{display:flex;align-items:center;gap:12px;min-width:0;cursor:pointer}
.pb-thumb{width:68px;aspect-ratio:16/9;border-radius:5px;overflow:hidden;background:#0d0d0c;flex-shrink:0;border:1px solid var(--line)}
.pb-thumb img{width:100%;height:100%;object-fit:cover}
.pb-title{font-family:var(--serif);font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pb-sub{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pb-sub .song{color:var(--gold)}
.pb-center{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.pb-controls{display:flex;align-items:center;gap:8px}
.pb-play{width:40px;height:40px;border-radius:50%;background:var(--gold);color:#1b1407;border:0;cursor:pointer;display:flex;align-items:center;justify-content:center}
.pb-play:hover{background:var(--gold-2)}
.pb-play:disabled{background:var(--line-2);color:var(--faint);cursor:not-allowed}
.pb-seek{display:flex;align-items:center;gap:10px;width:100%;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.pb-seek span{width:52px;flex-shrink:0} .pb-seek span:first-child{text-align:right}
.range{-webkit-appearance:none;appearance:none;width:100%;height:16px;background:transparent;cursor:pointer;--p:0%}
.range::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(90deg,var(--gold) var(--p),var(--line-2) var(--p))}
.range::-moz-range-track{height:4px;border-radius:2px;background:linear-gradient(90deg,var(--gold) var(--p),var(--line-2) var(--p))}
.range::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--text);margin-top:-4px}
.range::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--text);border:0}
.range:disabled{cursor:default;opacity:.5}
.pb-right{display:flex;align-items:center;justify-content:flex-end;gap:6px}
.pb-vol{width:100px}
.toggled{color:var(--gold)!important}

/* ---------- floating video + queue drawer ---------- */
.video-panel{position:fixed;right:20px;bottom:calc(var(--bar-h) + 14px);width:340px;z-index:55;border-radius:10px;overflow:hidden;
  background:#000;border:1px solid var(--line-2);box-shadow:0 18px 50px rgba(0,0,0,.6);display:none;transition:width .2s}
.video-panel.show{display:block}
.video-panel .vp-frame{aspect-ratio:16/9;position:relative;background:#000}
.video-panel .vp-frame>*{position:absolute;inset:0;width:100%;height:100%}
.video-panel .vp-bar{display:flex;justify-content:space-between;align-items:center;padding:4px 6px 4px 12px;background:#0f0f0e;font-size:12px;color:var(--muted)}
.video-panel.expanded{right:50%;transform:translateX(50%);bottom:auto;top:76px;width:min(1100px,92vw)}
.video-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:54;display:none}
.video-backdrop.show{display:block}
.vp-blocked{display:none!important;flex-direction:column;justify-content:center;gap:10px;padding:16px 18px;background:#121110;font-size:13px;line-height:1.45;overflow:auto}
.vp-blocked.show{display:flex!important}
.vp-blocked b{font-family:var(--serif);font-size:16px}
.file-banner{position:relative;z-index:1;max-width:1320px;margin:18px auto 0;padding:0 24px}
.file-banner .inner{border:1px solid rgba(217,112,95,.55);background:linear-gradient(110deg,rgba(217,112,95,.14),rgba(217,112,95,.03) 70%),var(--panel);border-radius:var(--radius);padding:18px 20px}
.file-banner ol{margin:10px 0 0;padding-left:20px;line-height:1.8;font-size:14px}
.file-banner ol li::marker{color:var(--gold)}
.cmd{display:flex;gap:8px;align-items:center;margin:4px 0;max-width:820px}
.cmd input{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;padding:7px 10px}
@media (max-width:760px){.file-banner{padding:0 14px}}
.vp-wait{display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px;padding:12px;text-align:center}
.queue-drawer{position:fixed;top:0;right:0;bottom:var(--bar-h);width:min(400px,100vw);z-index:65;background:var(--bg-2);border-left:1px solid var(--line-2);
  transform:translateX(100%);transition:transform .22s ease;display:flex;flex-direction:column;box-shadow:-20px 0 60px rgba(0,0,0,.5)}
.queue-drawer.open{transform:none}
.qd-head{padding:18px 18px 12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.qd-list{overflow:auto;flex:1;padding:10px}
.q-item{display:flex;align-items:center;gap:10px;padding:8px;border-radius:7px;border:1px solid transparent}
.q-item:hover{background:var(--panel)}
.q-item.current{background:var(--gold-dim);border-color:var(--gold-line)}
.q-item.past{opacity:.5}
.q-num{width:22px;text-align:right;font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
.q-main{flex:1;min-width:0;cursor:pointer}
.q-title{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.q-sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- automatic search: status pill + setup banner ---------- */
.auto-status{position:fixed;left:20px;bottom:calc(var(--bar-h) + 14px);z-index:56;display:none;align-items:center;gap:12px;max-width:min(420px,calc(100vw - 40px));
  background:#1f1c18;border:1px solid var(--gold-line);border-radius:12px;padding:10px 12px 10px 14px;box-shadow:0 12px 40px rgba(0,0,0,.5);font-size:13.5px}
.auto-status.show{display:flex}
.pulse{width:10px;height:10px;border-radius:50%;background:var(--gold);flex-shrink:0;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1.1)}}
.setup-banner{padding:20px 22px;margin-bottom:26px;display:flex;gap:20px;align-items:center;flex-wrap:wrap;border-color:var(--gold-line);
  background:linear-gradient(110deg,rgba(212,169,78,.12),rgba(212,169,78,.02) 60%),var(--panel)}
.setup-banner .sb-text{flex:1;min-width:260px}
.setup-banner .sb-title{font-family:var(--serif);font-size:21px;font-weight:700;margin-bottom:4px}
.chip-auto{color:#9fc7d6;border-color:rgba(159,199,214,.4)}
.steps{margin:8px 0 0;padding-left:20px;font-size:14px;line-height:1.7}
.steps li::marker{color:var(--gold)}
.sugg{display:flex;gap:10px;align-items:center;padding:8px;border:1px dashed var(--line-2);border-radius:8px;margin-bottom:8px}
.sugg img{width:96px;aspect-ratio:16/9;object-fit:cover;border-radius:4px;flex-shrink:0}
.sugg .s-t{font-size:13.5px;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* ---------- toasts ---------- */
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--bar-h) + 16px);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(560px,calc(100vw - 32px))}
.toast{pointer-events:auto;background:#24211c;border:1px solid var(--line-2);border-left:3px solid var(--gold);color:var(--text);padding:10px 14px;border-radius:8px;
  font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:tin .2s ease;max-width:100%}
.toast.error{border-left-color:var(--red)}
.toast code{background:rgba(0,0,0,.4);padding:1px 5px;border-radius:4px;font-size:12.5px}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- the few layout utilities used in markup (same as Tailwind's, so the
   page still lays out if the Tailwind CDN can't be reached) ---------- */
.flex{display:flex}.flex-wrap{flex-wrap:wrap}.items-center{align-items:center}.justify-center{justify-content:center}
.gap-1{gap:.25rem}.gap-2{gap:.5rem}.hidden{display:none}.whitespace-nowrap{white-space:nowrap}
.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (min-width:640px){.sm\:inline{display:inline}}

/* ---------- responsive ---------- */
@media (max-width:1000px){
  .shelves{grid-template-columns:1fr}
  .detail-body{grid-template-columns:1fr}
  .two-col{grid-template-columns:1fr}
  .side{position:static;max-height:300px}
}
@media (max-width:760px){
  :root{--bar-h:118px}
  .header-inner{flex-wrap:wrap;padding:10px 14px;gap:10px}
  .nav{order:3;flex-basis:100%}
  .header-actions{margin-left:auto}
  .header-actions .lbl{display:none}
  main{padding:20px 14px 30px}
  .view-title{font-size:30px}
  .year-readout{font-size:32px}
  .detail-hero,.detail-body{padding-left:18px;padding-right:18px}
  .detail-venue{font-size:28px}
  .player-bar{grid-template-columns:1fr auto;grid-template-rows:auto auto;gap:6px 10px;padding:8px 12px}
  .pb-center{grid-column:1 / -1;grid-row:2}
  .pb-vol,.pb-hide-sm{display:none}
  .video-panel{width:220px;right:10px}
  .video-panel.expanded{width:94vw;top:60px}
  .form-grid>*{grid-column:span 12!important}
  .row .r-thumb{width:72px}
  .perf .p-date{width:auto}
  .perf{flex-wrap:wrap}
}
</style>
</head>

    if (seen.has(h.concertId)) continue;
    seen.add(h.concertId);
    if (h.dismissed || h.position < 20 || (h.duration && h.position > h.duration - 45)) continue;
    const c = getConcert(h.concertId);
    if (c && c.sources.some(s => s.videoId === h.videoId && !s.dead)) out.push({ h, c });
  }
  return out;
}

/* ---- queue operations ---- */
function makeItem(c, src, startAt = 0, endAt = null) { return { qid: uid('q'), concertId: c.id, videoId: src.videoId, startAt, endAt }; }
function playNow(concertId, { videoId = null, startAt = 0 } = {}) {
  const c = getConcert(concertId);
  const src = c && (videoId ? c.sources.find(s => s.videoId === videoId) : playableSource(c));
  if (!src || !src.videoId) { toast('No playable video attached to this concert yet.', 'error'); return; }
  if (src.dead) toast('That source was flagged as a dead link — trying anyway.');
  session.queue = [makeItem(c, src, startAt)];
  session.origOrder = null;
  loadItem(0);
}
function addToQueue(concertId) {
  const c = getConcert(concertId), src = playableSource(c);
  if (!src) { toast('No playable video attached to this concert yet.', 'error'); return; }
  const it = makeItem(c, src);
  session.queue.push(it);
  if (session.origOrder) session.origOrder.push(it.qid);
  if (session.index < 0) session.index = 0;
  saveSession(); renderQueue(); renderPlayerBar();
  toast(`Added to queue: ${esc(concertLabel(c))}`);
}
/** Replace the queue with many items (concert ids or prepared items) and start playing. */
function playMany(entries, label) {
  const items = [];
  for (const e of entries) {
    if (typeof e === 'string') { const c = getConcert(e), s = playableSource(c); if (s) items.push(makeItem(c, s)); }
    else if (e) items.push(e);
  }
  if (!items.length) { toast('Nothing playable there yet — attach a video first.', 'error'); return; }
  session.origOrder = session.shuffle ? items.map(i => i.qid) : null;
  session.queue = session.shuffle ? shuffleArray(items) : items;
  loadItem(0);
  if (label) toast(`Playing ${esc(label)} — ${items.length} in queue`);
}
function nextItem(auto) {
  if (session.index < session.queue.length - 1) loadItem(session.index + 1);
  else {
    P.playing = false;
    if (auto) toast('End of the queue.');
    renderPlayerBar();
  }
}
function prevItem() {
  if (P.yt && P.ready && P.time > 5) { P.yt.seekTo(0, true); return; }
  if (session.index > 0) loadItem(session.index - 1);
}
function togglePlay() {
  const it = currentItem();
  if (!it) { surprise(); return; }
  if (!P.yt || !P.ready) {
    if (!session.queue[session.index].startAt) session.queue[session.index].startAt = resumePointFor(it.concertId, it.videoId);
    loadItem(session.index);
    return;
  }
  const st = P.yt.getPlayerState();
  if (st === YT.PlayerState.PLAYING || st === YT.PlayerState.BUFFERING) P.yt.pauseVideo();
  else if (st === YT.PlayerState.ENDED && session.index >= session.queue.length - 1) loadItem(session.index);
  else P.yt.playVideo();
}
function seekTo(t) { if (P.yt && P.ready) { P.yt.seekTo(t, true); P.time = t; P.yt.playVideo(); updateSeekUI(); } }
/** Seek if this concert/source is already loaded, otherwise start it at t. */
function seekOrPlay(concertId, videoId, t) {
  const it = currentItem();
  if (it && it.concertId === concertId && it.videoId === videoId && P.yt && P.ready) seekTo(t);
  else playNow(concertId, { videoId, startAt: t });
}
function toggleShuffle() {
  session.shuffle = !session.shuffle;
  const head = session.queue.slice(0, session.index + 1), rest = session.queue.slice(session.index + 1);
  if (session.shuffle) {
    session.origOrder = session.queue.map(i => i.qid);
    session.queue = head.concat(shuffleArray(rest));
  } else if (session.origOrder) {
    const pos = new Map(session.origOrder.map((q, i) => [q, i]));
    rest.sort((a, b) => (pos.get(a.qid) ?? 1e9) - (pos.get(b.qid) ?? 1e9));
    session.queue = head.concat(rest);
    session.origOrder = null;
  }
  saveSession(); renderPlayerBar(); renderQueue();
  toast(session.shuffle ? 'Shuffle on — upcoming queue shuffled.' : 'Shuffle off — original order restored.');
}
function stopPlayer() {
  savePosition(true);
  if (P.yt && P.ready) P.yt.stopVideo();
  P.playing = false;
  $('#video-panel').classList.remove('show', 'expanded');
  $('#video-backdrop').classList.remove('show');
  P.expanded = false;
  renderPlayerBar();
}
function surprise() {
  const pool = catalogue().filter(c => playableSource(c));
  if (!pool.length) { toast('Attach a video to a concert first — then Surprise Me has something to pick.'); return; }
  const c = pool[Math.floor(Math.random() * pool.length)];
  playNow(c.id);
  toast(`Surprise: ${esc(concertLabel(c))}`);
}

function updateSeekUI() {

function renderQueue() {

}
function queueMove(i, dir) {
  const j = i + dir, q = session.queue;
  if (j < 0 || j >= q.length) return;
  [q[i], q[j]] = [q[j], q[i]];
  if (session.index === i) session.index = j; else if (session.index === j) session.index = i;
  saveSession(); renderQueue(); renderPlayerBar();
}
function queueRemove(i) {
  if (i === session.index) return;
  session.queue.splice(i, 1);

const ROUTES = ['browse', 'songs', 'playlists', 'favorites', 'map', 'add', 'search', 'settings'];
function parseRoute() {
  const h = location.hash.replace(/^#\/?/, '');
  const [path, query = ''] = h.split('?');
  const parts = path.split('/').map(p => { try { return decodeURIComponent(p); } catch { return p; } });
  return { name: ROUTES.includes(parts[0]) ? parts[0] : 'browse', arg: parts[1] || null, params: new URLSearchParams(query) };
}
let route = parseRoute();
let mapInst = null;
let pendingPrefill = null; // hand-off from Search / dup-detection into the Add form

function renderNav() {
  const hasKey = !!lib.settings.ytApiKey;
  const items = [['browse', 'Browse'], ['songs', 'Song Explorer'], ['playlists', 'Playlists'], ['favorites', 'Favorites'], ['map', 'Map'],
    ...(hasKey ? [['search', 'Search']] : []), ['settings', 'Settings']];
  $('#nav').innerHTML = items.map(([k, label]) =>
    `<a href="#/${k}" class="${route.name === k ? 'active' : ''} ${k === 'songs' ? 'nav-songs' : ''}">${label}</a>`).join('');

function render() {

  renderView();
}
function renderView() {
  ({ browse: renderBrowse, songs: renderSongs, playlists: renderPlaylists, favorites: renderFavorites, map: renderMap,
     add: renderAdd, search: renderSearch, settings: renderSettings })[route.name]();
  markPlayingCards();
}

  if (detail.id) renderDetail();
  renderPlayerBar(); renderQueue();
}

function yearRange() {
  const ys = catalogue().map(c => c.year).filter(y => y > 1900);
  return { min: Math.min(1961, ...ys), max: Math.max(CURRENT_YEAR, ...ys) };
}
function yearCounts() { const m = new Map(); for (const c of catalogue()) m.set(c.year, (m.get(c.year) || 0) + 1); return m; }

function filteredConcerts() {
  const b = session.browse, q = b.q.trim().toLowerCase();
  const words = q ? q.split(/\s+/) : [];
  const list = catalogue().filter(c => {
    if (b.year != null && c.year !== b.year) return false;
    if (b.eras.length && !c.eras.some(e => b.eras.includes(e))) return false;
    if (b.type && !c.sources.some(s => s.videoId && s.type === b.type)) return false;
    if (b.favOnly && !isFav(c.id)) return false;
    if (b.videoOnly && !hasAttached(c)) return false;
    if (b.autoOnly && !(c.auto || c.sources.some(s => s.auto))) return false;
    if (words.length) {
      const hay = [c.venue, c.city, c.country, c.tour, c.notable, c.date, fmtDate(c.date), ...c.eras, ...c.setlist,
        ...c.sources.flatMap(s => [s.videoId ? s.title : '', s.channel, ...s.chapters.map(ch => ch.title)])].join(' | ').toLowerCase();
      if (!words.every(w => hay.includes(w))) return false;
    }
    return true;
  });
  if (b.sort === 'date-desc') list.reverse();
  else if (b.sort === 'recent') list.sort((a, b2) => (b2.addedAt - a.addedAt) || b2.date.localeCompare(a.date));
  return list;
}

function yearboxHtml() {

function wireBrowse() {

   17. Map (Leaflet + OpenStreetMap data)
   --------------------------------------------------------------------- */
/* Basemaps. Default needs no key; CARTO (which now watermarks keyless requests) is optional with a free key. */
const OSM_ATTR = '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors';
const MAP_STYLES = {
  'esri-dark': { label: 'Dark (Esri) — no key needed', layers: [
    ['https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', { maxZoom: 16, attribution: 'Tiles &copy; <a href="https://www.esri.com/">Esri</a> &mdash; Esri, HERE, Garmin, &copy; OpenStreetMap contributors' }],
    ['https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}', { maxZoom: 16, pane: 'labels' }]] },
  'osm-dark': { label: 'Dark street map (OpenStreetMap) — no key needed', dark: true, layers: [
    ['https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: OSM_ATTR }]] },
  'osm': { label: 'Classic street map (OpenStreetMap) — no key needed', layers: [
    ['https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: OSM_ATTR }]] },
  'carto-dark': { label: 'Dark Matter (CARTO) — needs a free CARTO key', needsKey: true, layers: [
    ['https://{s}.basemaps.cartocdn.com/rastertiles/dark_all/{z}/{x}/{y}{r}.png?api_key={key}', { maxZoom: 19, subdomains: 'abcd', attribution: OSM_ATTR + ' &copy; <a href="https://carto.com/attributions">CARTO</a>' }]] },
};
function currentMapStyle() {
  const id = lib.settings.mapStyle in MAP_STYLES ? lib.settings.mapStyle : 'esri-dark';
  return id === 'carto-dark' && !lib.settings.cartoKey ? 'esri-dark' : id;
}
/** Add the chosen basemap; if its tiles keep failing, fall back to the next no-key style once. */
function addBasemap(map, styleId = currentMapStyle(), tried = []) {
  const style = MAP_STYLES[styleId];
  if (!map.getPane('labels')) { map.createPane('labels'); map.getPane('labels').style.zIndex = 450; map.getPane('labels').style.pointerEvents = 'none'; }
  $('#map').classList.toggle('map-darken', !!style.dark);
  let errors = 0, loaded = 0, switched = false;
  const layers = style.layers.map(([url, opts]) => L.tileLayer(url.replace('{key}', encodeURIComponent(lib.settings.cartoKey || '')), opts).addTo(map));
  layers[0].on('tileload', () => { loaded++; });
  layers[0].on('tileerror', () => {
    errors++;
    if (switched || loaded || errors < 4) return;
    const next = ['esri-dark', 'osm-dark'].find(s => s !== styleId && !tried.includes(s));
    if (!next) return;
    switched = true;
    layers.forEach(l => map.removeLayer(l));
    toast(`Map tiles from ${esc(style.label.split(' —')[0])} didn't load — switched to ${esc(MAP_STYLES[next].label.split(' —')[0])}.`);
    addBasemap(map, next, [...tried, styleId]);
  });
}
function renderMap() {
  const all = catalogue(), mapped = all.filter(c => c.lat != null && c.lng != null), unmapped = all.length - mapped.length;
  $('#view').innerHTML = `<div class="kicker">Where it happened</div><h1 class="view-title">The Map</h1>
    <p class="view-sub">${mapped.length} concert${mapped.length === 1 ? '' : 's'} mapped${unmapped ? ` · ${unmapped} concert${unmapped === 1 ? '' : 's'} not mapped (no coordinates)` : ''}.</p>
    <div id="map"></div>`;
  if (!window.L) { $('#map').outerHTML = emptyState('The map library couldn\'t load', 'Check your internet connection and reload.'); return; }
  if (mapInst) { mapInst.remove(); mapInst = null; }
  mapInst = L.map('map', { worldCopyJump: true, zoomControl: true });
  addBasemap(mapInst);
  const groups = new Map();
  for (const c of mapped) { const k = `${c.lat.toFixed(3)},${c.lng.toFixed(3)}`; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(c); }
  const pts = [];
  for (const list of groups.values()) {
    const { lat, lng } = list[0];
    pts.push([lat, lng]);
    const html = `<div style="min-width:220px;max-height:260px;overflow:auto">${list.map(c => `<div class="pop-item">
        <div class="pop-date">${esc(fmtDate(c.date))}</div><div>${esc(c.venue)}</div><div class="small muted">${esc(placeLabel(c))}</div>
        <div class="flex gap-1" style="margin-top:6px">${playableSource(c) ? `<button class="btn btn-gold btn-sm" data-action="play" data-id="${esc(c.id)}">${icon('play')}Play</button>` : ''}
        <button class="btn btn-sm" data-action="open" data-id="${esc(c.id)}">Open</button></div></div>`).join('')}</div>`;
    L.circleMarker([lat, lng], { radius: 6 + Math.min(list.length, 6) * 1.6, color: '#d4a94e', weight: 2, fillColor: '#d4a94e', fillOpacity: 0.55 })
      .bindTooltip(list.length > 1 ? `${list[0].venue} · ${list.length} concerts` : `${fmtDate(list[0].date)} · ${list[0].venue}`)
      .bindPopup(html).addTo(mapInst);
  }
  if (pts.length > 1) mapInst.fitBounds(pts, { padding: [40, 40], maxZoom: 6 });
  else if (pts.length === 1) mapInst.setView(pts[0], 6);
  else mapInst.setView([30, -20], 2);
  setTimeout(() => mapInst && mapInst.invalidateSize(), 60);
}

/** How well an upload matches a concert. Returns -1 for "definitely not", otherwise a score (≥45 + evidence = attach). */
function scoreForConcert(v, c) {
  const title = v.title, text = `${title} ${v.description.slice(0, 600)}`;
  if (!/dylan/i.test(title) && !/dylan/i.test(v.channel)) return { score: -1 };
  const ty = yearsIn(title);
  if (ty.length && !ty.includes(c.year)) return { score: -1 };           // a different year's show
  if (ty.length > 1) return { score: -1 };                                // compilations
  const g = guessDateFromTitle(title), cFull = !c.date.endsWith('-00');

  if (g && !g.endsWith('-00')) {

  }
  const yearSeen = yearsIn(text).includes(c.year);
  if (!dateMatch && yearSeen) score += 15;
  const have = new Set(normWords(text));
  const vw = placeWords(c.venue), cw = placeWords(c.city);
  const venueRatio = vw.length ? vw.filter(w => have.has(w)).length / vw.length : 0;
  const cityRatio = cw.length ? cw.filter(w => have.has(w)).length / cw.length : 0;
  score += 30 * venueRatio + 10 * cityRatio;
  if (v.duration >= 1200) score += 10; else if (v.duration && v.duration < 240) score -= 40;

  return { score, ok: score >= 45 && (dateMatch || (yearSeen && venueRatio >= 0.5)) };

function concertQuery(c) { return `Bob Dylan ${c.venue} ${c.year}`; }

/** Attach uploads to a concert. The first becomes primary if nothing playable was there. */
function attachFound(concertId, vids) {
  const c = getConcert(concertId);
  const fresh = vids.filter(v => !lib.auto.rejected[v.id] && !findConcertByVideo(v.id));
  if (!c || !fresh.length) return 0;
  const needPrimary = !playableSource(c);
  mutateConcert(concertId, d => {
    d.sources = d.sources.filter(s => s.videoId);
    fresh.forEach((v, i) => {
      const src = candidateToSource(v, needPrimary && i === 0);
      if (src.primary) d.sources.forEach(s => { s.primary = false; });
      d.sources.push(src);
    });
    if (Array.isArray(d.setlist) && !d.setlist.length) { // personal concerts: fill an empty setlist from chapters
      const chs = fresh.map(v => chaptersFromDescription(v.description)).find(x => x.length);

/** Search for one concert. Attaches confident matches (max 2); returns the rest as suggestions. */
async function searchForConcert(c) {
  const q = concertQuery(c);
  const vids = await ytFindVideos(q, { max: 25 });
  lib.auto.queries[q] = Date.now();
  const scored = vids.filter(v => !lib.auto.rejected[v.id] && !findConcertByVideo(v.id))
    .map(v => ({ v, ...scoreForConcert(v, c) })).filter(x => x.score >= 0).sort((a, b) => b.score - a.score);
  const sure = scored.filter(x => x.ok).slice(0, 2);
  const attached = attachFound(c.id, sure.map(x => x.v));
  return { attached, suggestions: scored.filter(x => !sure.includes(x)).slice(0, 6).map(x => x.v) };

/** Sweep one year. Uploads need "Dylan", 20+ minutes, and one full date in the title to be placed. */
async function discoverYear(y) {
  const q = `Bob Dylan live ${y} concert`;
  const vids = await ytFindVideos(q, { long: true, max: 50 });
  lib.auto.queries[q] = Date.now();
  let attached = 0, created = 0;
  for (const v of vids) {
    if (lib.auto.rejected[v.id] || findConcertByVideo(v.id)) continue;
    if (!/dylan/i.test(v.title) || (v.duration && v.duration < 1200) || yearsIn(v.title).length > 1) continue;
    const date = guessDateFromTitle(v.title);
    if (!date || date.endsWith('-00')) continue;
    const yr = +date.slice(0, 4);
    if (yr < 1956 || yr > CURRENT_YEAR) continue;
    const place = extractPlace(v.title);
    const sameDay = catalogue().filter(c => c.date === date);
    // Dylan almost always played one show a day; prefer a venue match when there are several.
    const target = sameDay.find(c => venueSimilar(c.venue, place.venue) || (place.city && venueSimilar(c.city, place.city))) || sameDay[0];
    if (target) { attached += attachFound(target.id, [v]); continue; }

    let id = `${date}-${slugify(place.city || place.venue)}`, n = 2;
    const base = id; while (getConcert(id)) id = `${base}-${n++}`;
    lib.personalConcerts.push(normalizeConcert({
      id, date, venue: place.venue, city: place.city, country: '', eras: suggestEras(date).best, tour: '', notable: null,
      setlist: src.chapters.filter(ch => !isNonSong(ch.title)).map(ch => ch.title), sources: [src], addedAt: Date.now(), auto: true,
    }, true));
    saveLibrary();
    created++;
  }
  return { attached, created };
}

/** A batch: unmatched concerts first, then the least-recently swept years. Stops cleanly on quota. */
async function runAutoSearch({ manual = false } = {}) {
  if (AUTO.running) return;
  if (!lib.settings.ytApiKey) { if (manual) toast('Add a YouTube API key in Settings first.', 'error'); return; }
  const now = Date.now(), budget = lib.auto.perRun;
  const tasks = [];
  for (const c of catalogue()) {
    if (playableSource(c)) continue;
    const q = concertQuery(c);
    if (now - (lib.auto.queries[q] || 0) > 14 * DAY_MS) tasks.push({ kind: 'concert', id: c.id });
  }
  const years = [];
  for (let y = 1961; y <= CURRENT_YEAR; y++) {
    const last = lib.auto.queries[`Bob Dylan live ${y} concert`] || 0;
    if (now - last > 30 * DAY_MS) years.push({ kind: 'year', y, last });
  }
  years.sort((a, b) => a.last - b.last || a.y - b.y);
  const plan = [...tasks, ...years].slice(0, budget);
  if (!plan.length) {
    if (manual) toast('Everything has been searched recently. New searches open up as the 14/30-day windows pass.');
    lib.auto.lastRun = now; saveLibrary(false);
    return;
  }
  AUTO = { running: true, stop: false, done: 0, total: plan.length, attached: 0, created: 0, label: '' };
  renderAutoStatus();
  let ending = '';
  for (const t of plan) {
    if (AUTO.stop) { ending = 'Stopped.'; break; }
    try {
      if (t.kind === 'concert') {
        const c = getConcert(t.id);
        AUTO.label = c ? `${fmtDate(c.date)} · ${c.venue}` : '';
        renderAutoStatus();
        if (c) AUTO.attached += (await searchForConcert(c)).attached;
      } else {
        AUTO.label = `Shows from ${t.y}`;
        renderAutoStatus();
        const r = await discoverYear(t.y);
        AUTO.attached += r.attached; AUTO.created += r.created;
      }
      saveLibrary(false);
    } catch (e) {
      ending = e instanceof QuotaError ? 'YouTube\'s free daily quota is used up — the search picks up again tomorrow.' : `Search stopped: ${esc(e.message)}`;
      break;
    }
    AUTO.done++;
    renderAutoStatus();
    const typing = document.activeElement && /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
    if (!typing && AUTO.done % 3 === 0) refresh();
  }
  AUTO.running = false;
  const quota = /quota/.test(ending);
  if (AUTO.done || quota) lib.auto.lastRun = Date.now(); // a bad key or network error retries on the next open
  lib.auto.lastSummary = `${new Date().toLocaleString()}: ran ${AUTO.done} of ${AUTO.total} searches — ${AUTO.attached} video${AUTO.attached === 1 ? '' : 's'} attached to existing concerts, ${AUTO.created} new concert${AUTO.created === 1 ? '' : 's'} found.${ending ? ' ' + ending.replace(/<[^>]+>/g, '') : ''}`;
  saveLibrary();
  renderAutoStatus();
  if (route.name === 'settings') renderSettings(); else refresh();
  toast(`YouTube search: ${AUTO.attached} video${AUTO.attached === 1 ? '' : 's'} attached, ${AUTO.created} new concert${AUTO.created === 1 ? '' : 's'}.${ending ? ' ' + ending : ''}`, ending && !/Stopped/.test(ending) ? 'error' : 'info', 9000);
  geocodeAutoConcerts();
}

async function autoSearchOne(id, { quiet = false } = {}) {

/** Put auto-found concerts on the map (OpenStreetMap Nominatim, ≤1 request/second, a few per run). */
async function geocodeAutoConcerts() {
  const todo = lib.personalConcerts.filter(c => c.auto && c.lat == null && !c.geoTried && (c.city || c.venue !== 'Unknown venue')).slice(0, 15);
  for (const c of todo) {
    c.geoTried = true;

function saveEras() {
  readEraRowsFromDom();

  const out = [], names = new Set();
  for (const r of eraRows) {
    const name = String(r.name).trim();
    if (!name) { err.textContent = 'Every era needs a name.'; return; }
    if (names.has(name)) { err.textContent = `Two eras are named “${name}”.`; return; }
    const start = parseInt(r.start, 10), end = String(r.end ?? '').trim() === '' ? null : parseInt(r.end, 10);
    if (!Number.isFinite(start)) { err.textContent = `“${name}” needs a start year.`; return; }
    if (end != null && (!Number.isFinite(end) || end < start)) { err.textContent = `“${name}”: end year must be blank or ≥ start.`; return; }
    const months = parseMonths(r.months);
    if (months === undefined) { err.textContent = `“${name}”: months should look like 6-8 or 6,7,8 (or Jun-Aug).`; return; }
    names.add(name);
    out.push({ name, start, end, months });
  }
  if (!out.length) { err.textContent = 'Keep at least one era (or use Reset to defaults).'; return; }
  const renames = eraRows.filter(r => r.orig && r.orig !== String(r.name).trim()).map(r => [r.orig, String(r.name).trim()]);
  lib.eras = out;
  for (const [from, to] of renames) renameEraEverywhere(from, to);
  saveLibrary();

}
function renameEraEverywhere(from, to) {
  const swap = list => [...new Set(list.map(e => (e === from ? to : e)))];
  for (const p of lib.personalConcerts) if (p.eras.includes(from)) p.eras = swap(p.eras);
  for (const s of SEED) {
    const o = lib.seedOverrides[s.id], cur = o && Array.isArray(o.eras) ? o.eras : s.eras;
    if (cur.includes(from)) lib.seedOverrides[s.id] = { ...(o || {}), eras: swap(cur) };

  session.browse.eras = swap(session.browse.eras); saveSession();
}

async function checkLinks() {
  const ids = [...new Set(catalogue().flatMap(c => c.sources.map(s => s.videoId)).filter(Boolean))];
  const prog = $('#link-progress');
  if (!ids.length) { toast('No videos attached yet — nothing to check.'); return; }
  const btn = $('[data-action="check-links"]'); if (btn) btn.disabled = true;
  let done = 0, dead = 0, revived = 0, unknown = 0;
  const check = id => new Promise(res => {
    const img = new Image();
    const tm = setTimeout(() => { img.onload = img.onerror = null; res('unknown'); }, 12000);
    img.onload = () => { clearTimeout(tm); res(img.naturalWidth === 120 && img.naturalHeight === 90 ? 'dead' : 'ok'); };
    img.onerror = () => { clearTimeout(tm); res('unknown'); };
    img.src = `https://i.ytimg.com/vi/${id}/hqdefault.jpg?t=${Date.now()}`;
  });
  const queue = ids.slice();
  const worker = async () => {
    while (queue.length) {
      const id = queue.shift(), r = await check(id);
      if (r === 'dead') { if (!lib.deadLinks[id]) dead++; lib.deadLinks[id] = true; }
      else if (r === 'ok') { if (lib.deadLinks[id]) { revived++; delete lib.deadLinks[id]; } }
      else unknown++;
      done++;
      if (prog) prog.textContent = `Checked ${done} of ${ids.length}…`;
    }
  };
  await Promise.all(Array.from({ length: Math.min(6, ids.length) }, worker));
  saveLibrary();
  const total = Object.keys(lib.deadLinks).length;
  const msg = `Checked ${ids.length} video${ids.length === 1 ? '' : 's'}: ${dead} newly dead, ${revived} back online${unknown ? `, ${unknown} couldn't be reached` : ''}. ${total} flagged in total.`;
  if (route.name === 'settings') renderSettings();
  const p2 = $('#link-progress'); if (p2) p2.textContent = msg;
  toast(msg, dead ? 'error' : 'info', 7000);
  refresh();
}

function exportLibrary() {
  const data = { app: 'tambourine', version: 1, exportedAt: new Date().toISOString(),

    seedOverrides: lib.seedOverrides, deadLinks: lib.deadLinks, eras: lib.eras,

/** Merge an exported library into the current one. Never deletes anything already here. */
function mergeLibrary(cur, inc) {
  const n = { concerts: 0, sources: 0, favorites: 0, playlists: 0, plays: 0, eras: 0 };
  for (const [id, f] of Object.entries(inc.favorites)) {
    const c = cur.favorites[id];
    if (!c) { cur.favorites[id] = f; n.favorites++; }
    else { if (!c.note && f.note) c.note = f.note; c.tags = [...new Set([...c.tags, ...f.tags])]; }
  }
  for (const p of inc.playlists) {
    const c = cur.playlists.find(x => x.id === p.id);
    if (!c) { cur.playlists.push(p); n.playlists++; }
    else for (const it of p.items) if (!c.items.includes(it)) c.items.push(it);
  }
  const hk = h => `${h.concertId}|${h.videoId}|${h.playedAt}`, have = new Set(cur.history.map(hk));
  for (const h of inc.history) if (!have.has(hk(h))) { cur.history.push(h); n.plays++; }
  cur.history.sort((a, b) => a.playedAt - b.playedAt); cur.history = cur.history.slice(-500);
  const addSources = (into, from) => {
    for (const s of from) if (s.videoId && !into.some(x => x.videoId === s.videoId)) { into.push({ ...s, primary: false }); n.sources++; }
  };
  for (const c of inc.personalConcerts) {
    const ex = cur.personalConcerts.find(x => x.id === c.id);
    if (!ex) { cur.personalConcerts.push(c); n.concerts++; }
    else { const had = ex.sources.some(s => s.videoId); addSources(ex.sources, c.sources); if (!had) { ex.sources = ex.sources.filter(s => s.videoId); ensureOnePrimary(ex); } }
  }
  for (const [id, o] of Object.entries(inc.seedOverrides)) {
    const ex = cur.seedOverrides[id];
    if (!ex) { cur.seedOverrides[id] = o; n.sources += (o.sources || []).filter(s => s.videoId).length; continue; }
    if (o.sources) {
      const into = ex.sources ? ex.sources.filter(s => s.videoId) : [];
      addSources(into, o.sources);
      if (into.length) { ex.sources = into; if (!into.some(s => s.primary)) into[0].primary = true; }
    }
    if (!ex.eras && o.eras) ex.eras = o.eras;
  }
  Object.assign(cur.deadLinks, inc.deadLinks);
  Object.assign(cur.auto.rejected, inc.auto.rejected);
  for (const [q, t] of Object.entries(inc.auto.queries)) cur.auto.queries[q] = Math.max(cur.auto.queries[q] || 0, t);
  if (inc.eras) {
    const base = clone(cur.eras || DEFAULT_ERAS);
    for (const e of inc.eras) if (!base.some(b => b.name === e.name)) { base.push(e); n.eras++; }
    if (cur.eras || n.eras || JSON.stringify(inc.eras) !== JSON.stringify(DEFAULT_ERAS)) cur.eras = base;
  }
  return n;
}
function importLibrary(file) {
  const reader = new FileReader();
  reader.onload = () => {
    let raw;
    try { raw = JSON.parse(reader.result); } catch { toast('That file isn\'t valid JSON — nothing was imported.', 'error'); return; }
    const known = ['favorites', 'playlists', 'history', 'personalConcerts', 'seedOverrides', 'deadLinks', 'eras', 'auto'];
    if (!isObj(raw) || !known.some(k => k in raw)) { toast('That doesn\'t look like a Tambourine export — nothing was imported.', 'error'); return; }
    storageSet(BACKUP_KEY, JSON.stringify(lib)); // safety copy before merging
    const inc = normalizeLibrary({ ...raw, settings: {} });
    const n = mergeLibrary(lib, inc);

    renderNav(); renderSettings(); refresh();

  },
  'import': () => $('#import-file').click(),
  'clear-history': () => { if (!confirm('Clear all listening history? Continue Listening will be emptied.')) return; lib.history = []; P.hist = null; saveLibrary(false); renderSettings(); toast('History cleared.'); },
};
function plMove(plId, i, dir) {
  const p = lib.playlists.find(x => x.id === plId), j = i + dir;
  if (!p || j < 0 || j >= p.items.length) return;
  [p.items[i], p.items[j]] = [p.items[j], p.items[i]];
  saveLibrary(false); renderPlaylists();
}
// Capture phase so map popups (which stop bubbling) still reach us.
document.addEventListener('click', e => {
  const el = e.target.closest('a[href], [data-action]');
  if (!el || !el.dataset.action) return; // ordinary links behave normally
  const fn = ACTIONS[el.dataset.action];
  if (!fn) return;
  e.preventDefault();
  e.stopPropagation();
  if (el.disabled) return;
  try { fn(el, e); } catch (err) { console.error(err); toast('Something went wrong: ' + esc(err.message), 'error'); }
}, true);
document.addEventListener('keydown', e => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable;
  if (e.key === 'Escape') {
    if ($('#picker-root').classList.contains('open')) closePicker();
    else if (detail.id) closeDetail();
    else if ($('#queue-drawer').classList.contains('open')) $('#queue-drawer').classList.remove('open');
    else if (P.expanded) ACTIONS['toggle-expand']();
    return;
  }
  if (typing) return;
  if (e.key === ' ' && !/^(BUTTON|A)$/.test(e.target.tagName)) { e.preventDefault(); togglePlay(); }
  if (e.key === 'Enter' && e.target.classList.contains('card')) openDetail(e.target.dataset.id);
});
window.addEventListener('beforeunload', () => savePosition(true));
document.addEventListener('visibilitychange', () => { if (document.hidden) savePosition(true); });

/* ---------------------------------------------------------------------
   22. Boot
   --------------------------------------------------------------------- */
renderPlayerBar();
renderQueue();
render();
renderFileBanner();
maybeAutoRun();
</script>
</body>
</html>
